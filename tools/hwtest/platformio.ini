[env:esp32dev]
; Versions are pinned EXACTLY (== not ^) so a rebuild on another machine, or after a
; PlatformIO cache clear, reproduces the firmware that was actually verified on hardware.
; Caret ranges previously allowed silent minor upgrades — TFT_eSPI minor releases have
; historically changed sprite/font behavior, which is precisely what this project depends on.
; Verified working combination (built + flashed + serial-confirmed on 2026-09-16):
;   platform espressif32 6.12.0 -> framework-arduinoespressif32 3.20017 (Arduino core 2.0.17)
; Bump deliberately, one at a time, re-running `pio run` + a hardware smoke test.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  ; Upstream ships no tagged release usable here: the library's own library.properties
  ; says 1.3, but the PlatformIO registry serves it as this commit-snapshot string.
  ; Pinned to the exact string PlatformIO reports for the copy verified on hardware.
  paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  ; TOUCH_CS / SPI_TOUCH_FREQUENCY are deliberately NOT defined here. They enable
  ; TFT_eSPI's *own* XPT2046 driver, which would drive GPIO33 as a chip-select on the
  ; display's HSPI bus (TFT_eSPI.cpp does pinMode/digitalWrite(TOUCH_CS, HIGH) at init) —
  ; while this project drives that same pin via the separate XPT2046_Touchscreen library
  ; on the default VSPI bus. Two drivers owning one CS line across two buses is a latent
  ; conflict; it was harmless only because tft.getTouch() is never called. Touch pins for
  ; the library actually in use are defined in src/main.cpp (TOUCH_CS / TOUCH_IRQ).
  -D USE_HSPI_PORT
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT
